name: Utopia
description: Utopia was an online platform for designing, coding, and shipping React
  applications, pairing a visual design tool with a code editor over one source of
  truth. A 2020 Seedcamp portfolio company, it was built in the open as the MIT-licensed
  concrete-utopia/utopia monorepo (3.8k stars) with a first-party utopia-api npm library.
  The project has been dormant since mid-2025, utopia.app now serves a parked placeholder
  page, and no network API was ever published.
